name: Build and release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hebrewbooks-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-plugin:
    name: Verify and package plugin
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: npm run verify

      - name: Determine version and tag
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version in manifest.json: '$version' (expected X.Y.Z)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Package commit artifact
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p build/plugin
          (
            cd dist
            zip -q -r "../build/plugin/HebrewBooks-$VERSION.otzplugin" .
          )

      - name: Upload plugin build
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build-${{ github.sha }}
          path: |
            dist/
            build/plugin/*.otzplugin
          if-no-files-found: error
          retention-days: 14

  build-installer:
    name: Build Windows installer
    needs: build-plugin
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download plugin build
        uses: actions/download-artifact@v4
        with:
          name: plugin-build-${{ github.sha }}
          path: build-input

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Prepare and compile installer
        shell: pwsh
        env:
          VERSION: ${{ needs.build-plugin.outputs.version }}
        run: |
          $plugins = @(Get-ChildItem 'build-input/build/plugin/*.otzplugin')
          if ($plugins.Count -ne 1) {
            throw "Expected one plugin archive, found $($plugins.Count)."
          }
          $plugin = $plugins[0]
          $commit = '${{ github.sha }}'
          $suffix = if ('${{ github.ref }}' -eq 'refs/heads/main') {
            ''
          } else {
            '-' + $commit.Substring(0, 12)
          }
          ./installer/Prepare-Installer.ps1 `
            -PluginArchive $plugin.FullName `
            -AppVersion $env:VERSION `
            -OutputSuffix $suffix

      - name: Upload installer build
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.sha }}
          path: |
            installer/output/*.exe
            build-input/build/plugin/*.otzplugin
          if-no-files-found: error
          retention-days: 14

  release-check:
    name: Check release version
    if: github.ref == 'refs/heads/main'
    needs: build-plugin
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}

    steps:
      - name: Check whether the version is already released
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-plugin.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to store and GitHub Release
    if: github.ref == 'refs/heads/main' && needs.release-check.outputs.should_publish == 'true'
    needs: [build-plugin, build-installer, release-check]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download plugin build
        uses: actions/download-artifact@v4
        with:
          name: plugin-build-${{ github.sha }}
          path: build-input

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-${{ github.sha }}
          path: release-input

      - name: Check store credentials
        id: store
        shell: bash
        env:
          OTZARIA_USER: ${{ secrets.OTZARIA_USER }}
          OTZARIA_PASSWORD: ${{ secrets.OTZARIA_PASSWORD }}
        run: |
          if [[ -n "$OTZARIA_USER" && -n "$OTZARIA_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Store credentials are missing; skipping otzaria.org publication."
          fi

      - name: Validate, package and publish to otzaria.org
        id: otzaria
        if: steps.store.outputs.enabled == 'true'
        continue-on-error: true
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: build-input/dist
          otzaria-user: ${{ secrets.OTZARIA_USER }}
          otzaria-password: ${{ secrets.OTZARIA_PASSWORD }}

      - name: Report store publication failure
        if: steps.otzaria.outcome == 'failure'
        shell: bash
        run: echo "::warning::otzaria.org publication failed; continuing with the GitHub Release."

      - name: Determine plugin checksum
        id: plugin
        shell: bash
        run: |
          plugin_file="$(find build-input/build/plugin -maxdepth 1 -name '*.otzplugin' -type f -print -quit)"
          test -n "$plugin_file" || { echo 'Plugin archive is missing.' >&2; exit 1; }
          echo "file=$plugin_file" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$plugin_file" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-plugin.outputs.tag }}
          name: ${{ needs.build-plugin.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.plugin.outputs.file }}
            release-input/installer/output/*.exe
          body: |
            ## HebrewBooks לאוצריא — ${{ needs.build-plugin.outputs.tag }}

            המתקין ל-Windows מתקין את שירות החיפוש המקומי ומציע לפתוח את אוצריא
            דרך `otzaria://` כדי להשלים את התקנת התוסף. במהלך ההתקנה יש לבחור
            את תיקיית מאגר HebrewBooks שמכילה את `App\Katalog.db`.

            אפשר גם להתקין ידנית את קובץ ה-`.otzplugin` דרך מסך התוספים באוצריא.

            ### Checksum לתוסף
            ```
            SHA-256: ${{ steps.plugin.outputs.sha256 }}
            ```

name: Build and release

on:
  push:
  workflow_dispatch:

# Least privilege by default; only the job that publishes widens it.
permissions:
  contents: read

concurrency:
  group: hebrewbooks-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-plugin:
    name: Verify and package plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: npm run verify

      - name: Determine version and tag
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version in manifest.json: '$version' (expected X.Y.Z)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Package commit artifact
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p build/plugin
          (
            cd dist
            zip -q -r "../build/plugin/HebrewBooks-$VERSION.otzplugin" .
          )

      - name: Upload plugin build
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build-${{ github.sha }}
          path: |
            dist/
            build/plugin/*.otzplugin
          if-no-files-found: error
          retention-days: 14

  build-installer:
    name: Build Windows installer
    # ANGINE_PRIVATE reaches a private repository, so keep it off branch pushes:
    # only main reaches this job, and the environment can also require approval.
    if: github.ref == 'refs/heads/main'
    needs: build-plugin
    runs-on: windows-latest
    environment: service-runtime
    permissions:
      contents: read
    outputs:
      runtime_release: ${{ steps.runtime.outputs.repo }}@${{ steps.runtime.outputs.tag }}
      runtime_release_name: ${{ steps.runtime.outputs.name }}
      runtime_published: ${{ steps.runtime.outputs.published }}
      runtime_asset: ${{ steps.runtime.outputs.asset }}
      runtime_sha256: ${{ steps.provenance.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download plugin build
        uses: actions/download-artifact@v4
        with:
          name: plugin-build-${{ github.sha }}
          path: build-input

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # Without the token the installer would be built around a runtime it cannot
      # fetch, so resolve the release here and record exactly what it resolved to.
      - name: Resolve service runtime release
        id: runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ANGINE_PRIVATE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            Write-Output '::error::Secret ANGINE_PRIVATE is not set; the private service runtime cannot be downloaded.'
            exit 1
          }
          $release = (Get-Content installer/dependencies.json -Raw | ConvertFrom-Json).runtime.release
          $json = gh release view $release.tag --repo $release.repo --json tagName,name,publishedAt,targetCommitish,url,assets
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::ANGINE_PRIVATE cannot read release '$($release.tag)' of $($release.repo)."
            exit 1
          }
          $view = $json | ConvertFrom-Json
          $asset = @($view.assets | Where-Object { $_.name -eq $release.asset })
          if ($asset.Count -ne 1) {
            Write-Output "::error::Expected one asset named $($release.asset) in $($release.repo)@$($release.tag), found $($asset.Count)."
            exit 1
          }
          # dependencies.json names a rolling tag, so the dates and the digest are
          # what actually identify the engine build an installer was made from.
          function Set-StepOutput([string] $key, $value) {
            # ConvertFrom-Json returns dates as DateTime; keep them ISO-8601 in UTC.
            if ($value -is [datetime]) {
              $value = $value.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ', [cultureinfo]::InvariantCulture)
            }
            $flat = ([string] $value) -replace '[\r\n]+', ' '
            Add-Content -Path $env:GITHUB_OUTPUT -Value "${key}=$flat"
          }
          Set-StepOutput 'repo' $release.repo
          Set-StepOutput 'tag' $view.tagName
          Set-StepOutput 'name' $view.name
          Set-StepOutput 'published' $view.publishedAt
          Set-StepOutput 'commitish' $view.targetCommitish
          Set-StepOutput 'url' $view.url
          Set-StepOutput 'asset' $asset[0].name
          Set-StepOutput 'asset_updated' $asset[0].updatedAt
          Set-StepOutput 'asset_size' $asset[0].size
          Set-StepOutput 'published_digest' $asset[0].digest
          Write-Output "Service runtime source: $($release.repo)@$($view.tagName), asset digest $($asset[0].digest)"

      - name: Prepare and compile installer
        shell: pwsh
        env:
          VERSION: ${{ needs.build-plugin.outputs.version }}
          GH_TOKEN: ${{ secrets.ANGINE_PRIVATE }}
        run: |
          $plugins = @(Get-ChildItem 'build-input/build/plugin/*.otzplugin')
          if ($plugins.Count -ne 1) {
            throw "Expected one plugin archive, found $($plugins.Count)."
          }
          $plugin = $plugins[0]
          $commit = '${{ github.sha }}'
          $suffix = if ('${{ github.ref }}' -eq 'refs/heads/main') {
            ''
          } else {
            '-' + $commit.Substring(0, 12)
          }
          ./installer/Prepare-Installer.ps1 `
            -PluginArchive $plugin.FullName `
            -AppVersion $env:VERSION `
            -OutputSuffix $suffix

      - name: Record runtime provenance
        id: provenance
        shell: pwsh
        env:
          PLUGIN_VERSION: ${{ needs.build-plugin.outputs.version }}
          RUNTIME_REPO: ${{ steps.runtime.outputs.repo }}
          RUNTIME_TAG: ${{ steps.runtime.outputs.tag }}
          RUNTIME_RELEASE_NAME: ${{ steps.runtime.outputs.name }}
          RUNTIME_PUBLISHED: ${{ steps.runtime.outputs.published }}
          RUNTIME_COMMITISH: ${{ steps.runtime.outputs.commitish }}
          RUNTIME_URL: ${{ steps.runtime.outputs.url }}
          RUNTIME_ASSET: ${{ steps.runtime.outputs.asset }}
          RUNTIME_ASSET_UPDATED: ${{ steps.runtime.outputs.asset_updated }}
          RUNTIME_ASSET_SIZE: ${{ steps.runtime.outputs.asset_size }}
          RUNTIME_PUBLISHED_DIGEST: ${{ steps.runtime.outputs.published_digest }}
        run: |
          $dependencies = Get-Content installer/dependencies.json -Raw | ConvertFrom-Json
          $archive = Join-Path 'installer/staging/downloads' $dependencies.runtime.archive
          if (-not (Test-Path $archive)) {
            throw "Staged runtime archive $archive is missing; provenance cannot be recorded."
          }
          # Hash the archive that was actually packaged: GitHub does not report a
          # digest for every asset, and dependencies.json pins no checksum.
          $sha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $provenance = [ordered] @{
            plugin = [ordered] @{
              version = $env:PLUGIN_VERSION
              commit  = $env:GITHUB_SHA
              runId   = $env:GITHUB_RUN_ID
            }
            runtime = [ordered] @{
              repo            = $env:RUNTIME_REPO
              tag             = $env:RUNTIME_TAG
              releaseName     = $env:RUNTIME_RELEASE_NAME
              releaseUrl      = $env:RUNTIME_URL
              publishedAt     = $env:RUNTIME_PUBLISHED
              targetCommitish = $env:RUNTIME_COMMITISH
              asset           = $env:RUNTIME_ASSET
              assetUpdatedAt  = $env:RUNTIME_ASSET_UPDATED
              assetSize       = $env:RUNTIME_ASSET_SIZE
              publishedDigest = $env:RUNTIME_PUBLISHED_DIGEST
              sha256          = $sha256
            }
          }
          New-Item build -ItemType Directory -Force | Out-Null
          $provenance | ConvertTo-Json -Depth 5 | Set-Content build/runtime-provenance.json -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "sha256=$sha256"
          @(
            '### Search engine packaged by this build',
            '',
            '| field | value |',
            '| --- | --- |',
            "| release | $($env:RUNTIME_REPO)@$($env:RUNTIME_TAG) |",
            "| release name | $($env:RUNTIME_RELEASE_NAME) |",
            "| published | $($env:RUNTIME_PUBLISHED) |",
            "| target commitish | $($env:RUNTIME_COMMITISH) |",
            "| asset | $($env:RUNTIME_ASSET), $($env:RUNTIME_ASSET_SIZE) bytes, updated $($env:RUNTIME_ASSET_UPDATED) |",
            "| digest reported by GitHub | $($env:RUNTIME_PUBLISHED_DIGEST) |",
            "| SHA-256 of the packaged archive | $sha256 |"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload installer build
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.sha }}
          path: |
            installer/output/*.exe
            build-input/build/plugin/*.otzplugin
            build/runtime-provenance.json
          if-no-files-found: error
          retention-days: 14

  release-check:
    name: Check release version
    if: github.ref == 'refs/heads/main'
    needs: build-plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}

    steps:
      - name: Check whether the version is already released
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-plugin.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to store and GitHub Release
    if: github.ref == 'refs/heads/main' && needs.release-check.outputs.should_publish == 'true'
    needs: [build-plugin, build-installer, release-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download plugin build
        uses: actions/download-artifact@v4
        with:
          name: plugin-build-${{ github.sha }}
          path: build-input

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-${{ github.sha }}
          path: release-input

      - name: Check store credentials
        id: store
        shell: bash
        env:
          OTZARIA_USER: ${{ secrets.OTZARIA_USER }}
          OTZARIA_PASSWORD: ${{ secrets.OTZARIA_PASSWORD }}
        run: |
          if [[ -n "$OTZARIA_USER" && -n "$OTZARIA_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Store credentials are missing; skipping otzaria.org publication."
          fi

      - name: Validate, package and publish to otzaria.org
        id: otzaria
        if: steps.store.outputs.enabled == 'true'
        continue-on-error: true
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: build-input/dist
          otzaria-user: ${{ secrets.OTZARIA_USER }}
          otzaria-password: ${{ secrets.OTZARIA_PASSWORD }}

      - name: Report store publication failure
        if: steps.otzaria.outcome == 'failure'
        shell: bash
        run: echo "::warning::otzaria.org publication failed; continuing with the GitHub Release."

      - name: Determine plugin checksum
        id: plugin
        shell: bash
        run: |
          plugin_file="$(find build-input/build/plugin -maxdepth 1 -name '*.otzplugin' -type f -print -quit)"
          test -n "$plugin_file" || { echo 'Plugin archive is missing.' >&2; exit 1; }
          echo "file=$plugin_file" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$plugin_file" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-plugin.outputs.tag }}
          name: ${{ needs.build-plugin.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.plugin.outputs.file }}
            release-input/installer/output/*.exe
            release-input/build/runtime-provenance.json
          body: |
            ## HebrewBooks לאוצריא — ${{ needs.build-plugin.outputs.tag }}

            המתקין ל-Windows מתקין את שירות החיפוש המקומי ומציע לפתוח את אוצריא
            דרך `otzaria://` כדי להשלים את התקנת התוסף. במהלך ההתקנה יש לבחור
            את תיקיית מאגר HebrewBooks שמכילה את `App\Katalog.db`.

            אפשר גם להתקין ידנית את קובץ ה-`.otzplugin` דרך מסך התוספים באוצריא.

            ### Checksum לתוסף
            ```
            SHA-256: ${{ steps.plugin.outputs.sha256 }}
            ```

            ### מנוע החיפוש שנארז במתקין
            ```
            Release:   ${{ needs.build-installer.outputs.runtime_release }}
            Name:      ${{ needs.build-installer.outputs.runtime_release_name }}
            Published: ${{ needs.build-installer.outputs.runtime_published }}
            Asset:     ${{ needs.build-installer.outputs.runtime_asset }}
            SHA-256:   ${{ needs.build-installer.outputs.runtime_sha256 }}
            ```
